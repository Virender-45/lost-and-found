<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Register | Lost & Found</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    </head>
    <body>
        <nav class="navbar">
            <div class="logo">
                <i class="fa-solid fa-magnifying-glass"></i> Lost<span>&</span>Found
            </div>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="items.html">List of Items</a>
                <a href="login.html">Login</a>
            </div>
        </nav>
        <section class="page-banner">
            <div class="banner-icon">
                <i class="fa-solid fa-user-plus"></i>
            </div>
            <h1>Create an Account</h1>
            <p>Join Lost & Found to submit and track item reports.</p>
        </section>
        <section class="report-container auth-container">
            <div class="form-heading">
                <h2>Register</h2>
                <p>Create your regular user account.</p>
            </div>
            <form id="registerForm">
                <div class="form-group">
                    <label for="name">Full name</label>
                    <input id="name" type="text" autocomplete="name" maxlength="100" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input id="email" type="email" autocomplete="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password (minimum 8 characters)</label>
                    <input id="password" type="password" minlength="8" autocomplete="new-password" required>
                </div>
                <button class="submit-btn" type="submit">Create Account</button>
                <p id="message" role="status"></p>
            </form>
            <p>Already registered? <a href="login.html">Login here</a>.</p>
        </section>
        <script src("script.js"></script>
    </body>
</html>
