<!DOCTYPE html>
<html lang="en">
    <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login | Lost & Found</title>
        <link rel="stylesheet" href="style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"></head>
<body>
    <nav class="navbar">
        <div class="logo"><i class="fa-solid fa-magnifying-glass"></i> Lost<span>&</span>Found</div>
        <div class="nav-links"><a href="index.html">Home</a><a href="items.html">List of Items</a><a href="register.html">Register</a></div>
    </nav>
    <section class="page-banner">
        <div class="banner-icon"><i class="fa-solid fa-right-to-bracket"></i></div>
        <h1>Welcome Back</h1>
        <p>Log in to report items and manage your reports.</p>
    </section>
    <section class="report-container auth-container">
        <div class="form-heading">
            <h2>Login</h2>
            <p>Enter your account details.</p>
        </div>
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input id="email" type="email" autocomplete="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" type="password" autocomplete="current-password" required>
            </div>
            <button class="submit-btn" type="submit">Login</button>
            <p id="message" role="status"></p>
        </form>
        <p>Don't have an account? <a href="register.html">Register here</a>.</p>
    </section>
    <script src="script.js"></script>
</body>
</html>
